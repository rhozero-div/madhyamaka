<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>術語表 · 中觀學</title>
<link rel="stylesheet" href="assets/reader.css?v=24">
<style>
.gpage{padding:56px 22px 200px}
/* 頂欄是 sticky，錨點與展開後的自動捲動都留出它的高度 */
html{scroll-padding:66px 0 28px}
.gwrap{max-width:720px;margin:0 auto}
.g-kicker{font-family:var(--sans);font-size:10.5px;letter-spacing:.34em;color:var(--gold);margin:0 0 14px}
.g-h1{font-size:32px;font-weight:600;letter-spacing:.2em;margin:0 0 14px}
.g-sub{font-size:14px;line-height:2;color:var(--ink-2);margin:0 0 26px;letter-spacing:.01em}
.g-bar{display:flex;align-items:center;gap:12px;margin:0 0 8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
#gq{
  flex:1;min-width:0;height:38px;padding:0 12px;outline:none;
  font-family:var(--sans);font-size:13px;color:var(--ink);
  background:var(--paper-2);border:1px solid var(--line);border-radius:4px;
}
#gq:focus{border-color:rgba(156,58,48,.4)}
.g-count{flex:none;font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--ink-3)}
.g-row{
  display:flex;align-items:baseline;gap:10px;padding:10px 8px;cursor:pointer;
  border-bottom:1px solid var(--line-2);transition:.15s;
}
.g-row:hover{background:rgba(33,30,25,.035)}
.g-k{flex:none;min-width:5.4em;font-size:16px;letter-spacing:.06em;color:var(--ink)}
.g-k.wait{color:var(--ink-3)}
.g-aka{
  flex:none;font-family:var(--sans);font-size:11px;color:var(--ink-3);
  max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.g-t{
  flex:1;min-width:0;font-size:13px;line-height:1.7;color:var(--ink-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.g-t.wait{color:var(--ink-3);letter-spacing:.1em;font-size:12px}
.g-n{
  flex:none;font-family:var(--sans);font-size:11px;color:var(--ink-3);
  min-width:2.4em;text-align:right;
}
.ed-ro{font-size:12.5px;line-height:1.85;color:var(--ink-3);letter-spacing:.02em}
.g-chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);padding-top:8px}
.g-empty{padding:26px 8px;font-family:var(--sans);font-size:12.5px;color:var(--ink-3)}

/* 點一條即就地展開全文：一次只開一條，免得長條把列表撐散 */
.g-car{
  flex:none;width:.8em;text-align:center;
  font-family:var(--sans);font-size:11px;color:var(--ink-3);transition:transform .18s;
}
.g-row.on{background:rgba(156,58,48,.05);box-shadow:inset 2px 0 0 rgba(156,58,48,.35)}
.g-row.on .g-car{transform:rotate(90deg);color:var(--red)}
.g-panel{
  margin:0 0 2px;padding:6px 16px 20px;
  border-bottom:1px solid var(--line-2);
  background:linear-gradient(180deg,rgba(156,58,48,.035),rgba(156,58,48,0) 62%);
}
.g-panel p{
  font-size:14.5px;line-height:2.05;letter-spacing:.01em;color:var(--ink);
  margin:0 0 14px;text-align:justify;
}
.g-panel p:last-child{margin-bottom:0}
.g-panel .g-p-meta{
  font-family:var(--sans);font-size:11px;line-height:1.95;letter-spacing:.05em;
  color:var(--ink-3);margin:0 0 12px;text-align:left;
}
.g-panel .g-p-edit{
  margin:16px 0 0;padding-top:12px;border-top:1px dashed var(--line);
  font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;color:var(--red);
  cursor:pointer;text-align:left;
}
.g-panel .g-p-edit:hover{opacity:.72}
.g-panel .tc-quote{margin:16px 0 0;padding-left:12px;border-left-color:rgba(156,58,48,.22)}
.g-panel .tc-quote > * + *{margin-top:9px}      /* 一條引文與下一條之間留白 */
.g-panel .tc-quote .tq-q,.g-panel .tc-quote .tq-l{margin-top:2px}
.g-panel .tq-q{font-size:13px;line-height:2}
@media (max-width:720px){
  .g-panel{padding:4px 10px 16px}
  .g-panel p{font-size:14px;line-height:2}
}
@media (max-width:720px){
  .gpage{padding:34px 16px 190px}
  .g-h1{font-size:26px}
  .g-aka{display:none}
  .g-k{min-width:4.6em;font-size:15px}
}
</style>
</head>
<body>
<div id="bar"></div>

<header class="top">
  <a class="brand" href="reading.html" title="返回閱讀目錄"><span class="seal">語</span><b>術語表</b></a>
  <nav class="crumb"><a href="index.html">中觀學</a><i>›</i><a href="reading.html">閱讀</a><i>›</i><span>術語</span></nav>
  <div class="where" id="where"></div>
  <div class="tools"><a href="reading.html">閱讀</a></div>
</header>

<main class="gpage"><div class="gwrap">
  <p class="g-kicker">Glossary</p>
  <h1 class="g-h1">術語表</h1>
  <p class="g-sub" id="gSub">
    注文中可點之詞，釋義在此撰寫。留空者標「待撰」，暫不在注文裡加鏈。<br>
    點任一條即展開全文，再點收起；右端數字是該詞在現有注文中出現的次數。
  </p>

  <div class="g-bar">
    <input id="gq" type="search" placeholder="篩選術語……" autocomplete="off">
    <span class="g-count" id="gCount"></span>
  </div>
  <div class="g-list" id="gList"></div>
</div></main>

<div class="editor" id="ged">
  <div class="ed-in">
    <div class="ed-quote" id="gedHead"></div>
    <div class="ed-fields">
      <label class="ed-f"><span class="ed-k">術語</span><input id="gk" placeholder="詞，如「緣起」"></label>
      <label class="ed-f"><span class="ed-k">異名</span><input id="gaka" placeholder="以「、」隔開，可空"></label>
      <label class="ed-f"><span class="ed-k k-guan">釋義</span><textarea id="gt" rows="3" placeholder="一句話說清其義；可另起一行引經論原文"></textarea></label>
      <label class="ed-f"><span class="ed-k">所據</span><input id="grefs" placeholder="經論名，以「、」隔開，可空"></label>
      <label class="ed-f"><span class="ed-k">所引</span><span class="ed-ro" id="gsrc">無</span></label>
      <label class="ed-f"><span class="ed-k">加鏈</span><span class="g-chk"><input type="checkbox" id="gauto"> 注文中自動加鏈（每條注只鏈首次）</span></label>
    </div>
    <div class="ed-act">
      <span class="hint" id="gHint"></span>
      <button id="gDel" class="danger">刪除</button>
      <button id="gCancel">取消</button>
      <button id="gSave" class="pri">存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/glossary.js?v=25"></script>
</body>
</html>
